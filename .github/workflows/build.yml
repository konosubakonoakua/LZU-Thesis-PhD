name: build

# 每次 push / PR 自动编译模板并打包发布 zip，防止改动导致编译/打包回归
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # latex-action 默认在 Docker 容器内编译（installer: container），
      # 与宿主环境隔离：宿主机 apt 装的包到不了容器里。
      # 所以环境准备放进 action 的 pre_compile（容器内执行）：
      #   - make          post_compile 里跑 make dist 需要
      #   - zip           打包需要
      #   - fonts-liberation  英文摘要 Arial 的 Linux 回退字体
      - name: Compile and package
        uses: xu-cheng/latex-action@v3
        with:
          root_file: template-PhD.tex
          latexmk_use_xelatex: true
          # 与本地 make build 一致：所有产物直接进 build/
          args: -outdir=build
          pre_compile: |
            apt-get update && apt-get install -y make zip fonts-liberation
          post_compile: |
            make dist

      - name: Upload PDF and dist zip
        uses: actions/upload-artifact@v4
        with:
          name: LZUThesis-PhD
          path: |
            build/template-PhD.pdf
            build/*.zip
