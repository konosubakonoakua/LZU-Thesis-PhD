name: build

# 每次 push / PR 自动编译模板并打包发布 zip，防止改动导致编译/打包回归
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 容器内编译（latex-action 默认 texlive-full 容器镜像）：
      # 镜像内没有 apt/apk 等系统包管理（装不了任何东西），但 TeX Live 齐全、
      # 编译无需额外系统包（英文摘要 Arial 缺失由模板回退链兜底）。
      # 产物写入 build/（工作区挂载，宿主可见）
      - name: Compile thesis
        uses: xu-cheng/latex-action@v3
        with:
          root_file: template-PhD.tex
          latexmk_use_xelatex: true
          # 与本地 make build 一致：所有产物直接进 build/
          args: -outdir=build

      # 打包在宿主机做（ubuntu 有 apt）：make package 只拷文件+zip，
      # 不依赖 latexmk，规避容器缺工具的问题
      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      # 容器以 root 运行，build/ 产物属主是 root，宿主 runner 用户无权写入；
      # 打包前先把属主改回 runner 用户
      - name: Fix build/ ownership (container ran as root)
        run: sudo chown -R "$USER:$USER" build

      - name: Package (make package)
        run: make package

      - name: Upload PDF and dist zip
        uses: actions/upload-artifact@v4
        with:
          name: LZUThesis-PhD
          path: |
            build/template-PhD.pdf
            build/*.zip
