name: build

# 每次 push / PR 自动编译模板并打包发布 zip，防止改动导致编译/打包回归
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Linux runner 缺 Arial 字体（英文摘要 "Abstract" 用）；模板已回退到
      # Liberation Sans，这里提前装好保证回退字体存在；zip 供 make dist 使用
      - name: Install fonts + zip
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation zip

      # 编译 + 打包都放 latex-action 环境内执行：
      # 它安装的 TeX Live 只在该步的 PATH 里生效，独立 run 步骤拿不到
      # （否则 make dist 会报 latexmk: command not found）
      - name: Compile and package (make build + make dist)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: template-PhD.tex
          latexmk_use_xelatex: true
          # 与本地 make build 一致：所有产物直接进 build/
          args: -outdir=build
          post_compile: |
            make dist

      - name: Upload PDF and dist zip
        uses: actions/upload-artifact@v4
        with:
          name: LZUThesis-PhD
          path: |
            build/template-PhD.pdf
            build/*.zip
