name: build

# 每次 push / PR 自动编译模板并打包发布 zip，防止改动导致编译/打包回归
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile thesis (latexmk -outdir=build)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: template-PhD.tex
          latexmk_use_xelatex: true
          # 与本地 make build 一致：所有产物直接进 build/
          args: -outdir=build

      - name: Install zip (for make dist)
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Package (make dist)
        run: make dist

      - name: Upload PDF and dist zip
        uses: actions/upload-artifact@v4
        with:
          name: LZUThesis-PhD
          path: |
            build/template-PhD.pdf
            build/*.zip
